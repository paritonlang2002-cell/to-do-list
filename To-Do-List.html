<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #eef2ff;
            color: #111827;
        }

        .container {
            width: min(100%, 550px);
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        .task-form {
            display: flex;
            gap: 10px;
        }

        .task-input {
            flex: 1;
            min-width: 0;
            padding: 13px 15px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
        }

        .task-input:focus {
            border-color: #4f46e5;
        }

        .add-button {
            padding: 13px 20px;
            border: none;
            border-radius: 9px;
            background: #4f46e5;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-button:hover {
            opacity: 0.9;
        }

        .progress-section {
            margin-top: 22px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #6b7280;
            font-size: 14px;
        }

        .progress {
            height: 8px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0;
            height: 100%;
            background: #4f46e5;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 22px 0 15px;
        }

        .filter {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            background: #f3f4f6;
            color: #4b5563;
            cursor: pointer;
        }

        .filter.active {
            background: #111827;
            color: white;
        }

        .task-list {
            display: grid;
            gap: 10px;
            max-height: 350px;
            overflow-y: auto;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #f9fafb;
        }

        .task-checkbox {
            width: 19px;
            height: 19px;
            flex-shrink: 0;
            cursor: pointer;
            accent-color: #4f46e5;
        }

        .task-text {
            flex: 1;
            word-break: break-word;
            color: #374151;
        }

        .task.completed .task-text {
            color: #9ca3af;
            text-decoration: line-through;
        }

        .delete-button {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 7px;
            background: #fee2e2;
            color: #dc2626;
            font-size: 17px;
            cursor: pointer;
        }

        .delete-button:hover {
            background: #fecaca;
        }

        .empty {
            padding: 25px;
            text-align: center;
            color: #9ca3af;
            border: 1px dashed #d1d5db;
            border-radius: 10px;
        }

        .clear-button {
            width: 100%;
            margin-top: 15px;
            padding: 11px;
            border: none;
            border-radius: 9px;
            background: #f3f4f6;
            color: #4b5563;
            font-weight: bold;
            cursor: pointer;
        }

        .clear-button:hover {
            background: #e5e7eb;
        }

        @media (max-width: 500px) {
            .container {
                padding: 22px;
            }

            .task-form {
                flex-direction: column;
            }

            .add-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>To-Do List</h1>
        <p class="subtitle">Organize your tasks and get things done.</p>

        <form class="task-form" id="taskForm">
            <input
                class="task-input"
                id="taskInput"
                type="text"
                placeholder="What needs to be done?"
                maxlength="100"
                autocomplete="off"
            >
            <button class="add-button" type="submit">Add Task</button>
        </form>

        <section class="progress-section">
            <div class="progress-info">
                <span id="progressText">0 of 0 completed</span>
                <span id="progressPercent">0%</span>
            </div>

            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </section>

        <div class="filters">
            <button class="filter active" data-filter="all">All</button>
            <button class="filter" data-filter="active">Active</button>
            <button class="filter" data-filter="completed">Completed</button>
        </div>

        <section class="task-list" id="taskList"></section>

        <button class="clear-button" id="clearCompleted">
            Clear Completed
        </button>
    </main>

    <script>
        const taskForm = document.getElementById("taskForm");
        const taskInput = document.getElementById("taskInput");
        const taskList = document.getElementById("taskList");
        const progressText = document.getElementById("progressText");
        const progressPercent = document.getElementById("progressPercent");
        const progressBar = document.getElementById("progressBar");
        const clearCompleted = document.getElementById("clearCompleted");
        const filters = document.querySelectorAll(".filter");

        let tasks = [];
        let currentFilter = "all";

        function addTask(text) {
            tasks.push({
                id: Date.now(),
                text: text,
                completed: false
            });

            renderTasks();
        }

        function toggleTask(id) {
            tasks = tasks.map(task =>
                task.id === id
                    ? { ...task, completed: !task.completed }
                    : task
            );

            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            renderTasks();
        }

        function getFilteredTasks() {
            if (currentFilter === "active") {
                return tasks.filter(task => !task.completed);
            }

            if (currentFilter === "completed") {
                return tasks.filter(task => task.completed);
            }

            return tasks;
        }

        function renderTasks() {
            const filteredTasks = getFilteredTasks();

            taskList.innerHTML = "";

            if (filteredTasks.length === 0) {
                const emptyMessage = document.createElement("div");
                emptyMessage.className = "empty";
                emptyMessage.textContent =
                    currentFilter === "all"
                        ? "No tasks yet. Add one above!"
                        : "No tasks in this category.";

                taskList.appendChild(emptyMessage);
            } else {
                filteredTasks.forEach(task => {
                    const taskElement = document.createElement("div");
                    taskElement.className =
                        `task ${task.completed ? "completed" : ""}`;

                    const checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.className = "task-checkbox";
                    checkbox.checked = task.completed;

                    checkbox.addEventListener("change", () => {
                        toggleTask(task.id);
                    });

                    const text = document.createElement("span");
                    text.className = "task-text";
                    text.textContent = task.text;

                    const deleteButton = document.createElement("button");
                    deleteButton.className = "delete-button";
                    deleteButton.type = "button";
                    deleteButton.textContent = "×";
                    deleteButton.setAttribute("aria-label", "Delete task");

                    deleteButton.addEventListener("click", () => {
                        deleteTask(task.id);
                    });

                    taskElement.appendChild(checkbox);
                    taskElement.appendChild(text);
                    taskElement.appendChild(deleteButton);

                    taskList.appendChild(taskElement);
                });
            }

            updateProgress();
        }

        function updateProgress() {
            const completedTasks = tasks.filter(task => task.completed).length;
            const totalTasks = tasks.length;

            const percentage = totalTasks === 0
                ? 0
                : Math.round((completedTasks / totalTasks) * 100);

            progressText.textContent =
                `${completedTasks} of ${totalTasks} completed`;

            progressPercent.textContent = `${percentage}%`;
            progressBar.style.width = `${percentage}%`;
        }

        taskForm.addEventListener("submit", event => {
            event.preventDefault();

            const text = taskInput.value.trim();

            if (!text) {
                return;
            }

            addTask(text);

            taskInput.value = "";
            taskInput.focus();
        });

        filters.forEach(filter => {
            filter.addEventListener("click", () => {
                filters.forEach(button => button.classList.remove("active"));

                filter.classList.add("active");
                currentFilter = filter.dataset.filter;

                renderTasks();
            });
        });

        clearCompleted.addEventListener("click", () => {
            tasks = tasks.filter(task => !task.completed);
            renderTasks();
        });

        renderTasks();
    </script>
</body>
</html>
